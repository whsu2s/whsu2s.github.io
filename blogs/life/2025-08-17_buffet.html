<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>German Buffet</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="../../css/styles.css" rel="stylesheet" />
  <style>
    pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">
  <!-- Header -->
  <header class="bg-blue-600 text-white p-4">
    <h1 class="text-3xl font-bold">Work Blogs</h1>
    <nav class="mt-2">
      <a href="../../index.html" class="text-white hover:underline mr-4">Home</a>
      <a href="../research.html" class="text-white hover:underline mr-4">Research</a>
      <a href="../work.html" class="text-white hover:underline mr-4">Work</a>
      <a href="../life.html" class="text-white hover:underline">Life</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto p-4">
    <article class="my-8">
      <h2 class="text-2xl font-semibold mb-2">德式自助餐 German Buffet</h2>
      <p class="text-gray-500 text-sm mb-4">Posted on 17 August, 2025</p>

      <p class="text-gray-700 mb-4">
        {{content-paragraph-1}}
      </p>

      <!-- Optional Image -->
      <figure class="my-4">
        <img src="../../images/{{image-filename}}" alt="{{image-alt}}" class="w-full h-auto" />
        <figcaption class="text-center text-sm text-gray-600 mt-2">
          Figure 1: {{caption}}
        </figcaption>
      </figure>

      <!-- Optional Code Block -->
      <pre><code>{{code-block}}</code></pre>

      <!-- More Content -->
      <p class="text-gray-700 mb-4">
        {{content-paragraph-2}}
      </p>

      <!-- References -->
      <h2 class="text-xl font-semibold mt-8 mb-2">References</h2>
      <ol class="list-decimal list-inside text-gray-700 text-sm">
        <li id="ref1">[1] Author(s). <i>Title.</i> Publisher, Year.</li>
        <!-- Add more references as needed -->
      </ol>
    </article>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white p-4 text-center">
    <p>© 2025 whsu2s. Hosted on GitHub Pages.</p>
  </footer>
</body>
</html>
